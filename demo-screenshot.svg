<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-label="CET-6 Pop Culture Vocabulary Card Viewer demo screenshot">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#eef8fb"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#88a3b8" flood-opacity=".18"/>
    </filter>
    <style>
      .title { font: 800 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #020617; }
      .eyebrow { font: 800 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; fill: #0e7490; }
      .stat-number { font: 800 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #020617; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .button { font: 800 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1e293b; }
      .button-light { font: 800 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .word { font: 900 82px Georgia, "Times New Roman", serif; fill: #020617; }
      .body { font: 600 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .muted { fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1600" height="930" fill="url(#bg)"/>

  <g filter="url(#softShadow)">
    <rect x="54" y="24" width="1492" height="120" rx="10" fill="#ffffff" opacity=".72"/>
    <text x="80" y="62" class="eyebrow">CET-6 CARD VIEWER</text>
    <text x="80" y="112" class="title">CET-6 Pop Culture Vocabulary</text>
    <rect x="1328" y="62" width="123" height="42" rx="9" fill="#020617"/>
    <text x="1348" y="90" class="button-light">第 1 / 64 张</text>
    <rect x="1464" y="56" width="52" height="52" rx="11" fill="#ffffff" stroke="#dbe7f0"/>
    <path d="M1492 74a14 14 0 1 0 12 21a18 18 0 1 1-12-21Z" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#softShadow)">
    <g>
      <rect x="54" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="74" y="221" class="stat-number">1962</text>
      <text x="74" y="249" class="label">总卡片</text>
    </g>
    <g>
      <rect x="242" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="262" y="221" class="stat-number">64</text>
      <text x="262" y="249" class="label">筛选后</text>
    </g>
    <g>
      <rect x="430" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="450" y="221" class="stat-number">1136</text>
      <text x="450" y="249" class="label">A 类</text>
    </g>
    <g>
      <rect x="618" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="638" y="221" class="stat-number">590</text>
      <text x="638" y="249" class="label">B 类</text>
    </g>
    <g>
      <rect x="806" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="826" y="221" class="stat-number">236</text>
      <text x="826" y="249" class="label">C 类</text>
    </g>
    <g>
      <rect x="994" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="1014" y="221" class="stat-number">0</text>
      <text x="1014" y="249" class="label">已掌握</text>
    </g>
    <g>
      <rect x="1182" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="1202" y="221" class="stat-number">1</text>
      <text x="1202" y="249" class="label">收藏</text>
    </g>
    <g>
      <rect x="1370" y="172" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="1390" y="221" class="stat-number">0</text>
      <text x="1390" y="249" class="label">待复习</text>
    </g>
    <g>
      <rect x="54" y="288" width="174" height="101" rx="8" fill="#ffffff" opacity=".8"/>
      <text x="74" y="337" class="stat-number">30</text>
      <text x="74" y="365" class="label">分类</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="54" y="420" width="782" height="50" rx="8" fill="#ffffff" stroke="#d8e5ef"/>
    <circle cx="76" cy="445" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M82 451l8 8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <text x="101" y="452" class="body" fill="#94a3b8">搜索 word / lemma / 中文释义 / 台词 / 搭配...</text>

    <rect x="850" y="420" width="148" height="50" rx="8" fill="#ffffff" stroke="#d8e5ef"/>
    <text x="862" y="452" class="button">Page1</text>
    <path d="M974 441l6 6l6-6M974 452l6-6l6 6" stroke="#1e293b" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1014" y="420" width="128" height="50" rx="8" fill="#ffffff" stroke="#d8e5ef"/>
    <text x="1026" y="452" class="button">All Status</text>

    <rect x="1158" y="420" width="132" height="50" rx="8" fill="#ffffff" stroke="#d8e5ef"/>
    <text x="1170" y="452" class="button">All Learning</text>

    <rect x="1304" y="420" width="130" height="50" rx="8" fill="#020617"/>
    <text x="1330" y="452" class="button-light">随机一张</text>

    <rect x="1448" y="420" width="96" height="50" rx="8" fill="#ffffff" stroke="#d8e5ef"/>
    <text x="1480" y="452" class="button">总览</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="54" y="498" width="1492" height="398" rx="10" fill="#ffffff" opacity=".82"/>
    <rect x="84" y="526" width="118" height="30" rx="15" fill="#fef3c7" stroke="#facc15"/>
    <text x="98" y="547" class="small" fill="#b45309">C · 结构记忆卡</text>
    <rect x="216" y="526" width="158" height="30" rx="15" fill="#f1f5f9" stroke="#dbe7f0"/>
    <text x="230" y="547" class="small">STRUCTURE BASED</text>
    <rect x="386" y="526" width="78" height="30" rx="15" fill="#f1f5f9" stroke="#dbe7f0"/>
    <text x="402" y="547" class="small">PAGE1</text>

    <text x="84" y="640" class="word">initially</text>
    <rect x="84" y="666" width="158" height="40" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="102" y="693" class="body" fill="#0e7490">US  /ɪˈnɪʃəli/</text>
    <text x="84" y="744" class="body">lemma: initially</text>
    <rect x="210" y="722" width="78" height="30" rx="15" fill="#f1f5f9"/>
    <text x="224" y="743" class="small">adverb</text>

    <g transform="translate(1278 528)">
      <path d="M11 1l8 4v7c0 6-8 10-8 10s-8-4-8-10V5l8-4Z" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="30" y="18" class="label">已掌握</text>
      <circle cx="11" cy="54" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M7 54l3 3l6-7" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round"/>
      <text x="30" y="60" class="label">收藏</text>
      <circle cx="11" cy="92" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M11 87v6l5 3" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <text x="30" y="98" class="label">待复习</text>
    </g>

    <line x1="54" y1="782" x2="1546" y2="782" stroke="#e2e8f0"/>
    <rect x="84" y="812" width="744" height="92" rx="8" fill="#ffffff" stroke="#d8e5ef"/>
    <text x="110" y="844" class="small">CORE MEANING / 核心释义</text>
    <rect x="110" y="862" width="54" height="28" rx="14" fill="#cffafe" stroke="#67e8f9"/>
    <text x="128" y="881" class="small" fill="#0e7490">最初</text>
    <rect x="172" y="862" width="54" height="28" rx="14" fill="#cffafe" stroke="#67e8f9"/>
    <text x="190" y="881" class="small" fill="#0e7490">起初</text>
    <rect x="234" y="862" width="72" height="28" rx="14" fill="#cffafe" stroke="#67e8f9"/>
    <text x="252" y="881" class="small" fill="#0e7490">开始时</text>

    <rect x="848" y="812" width="668" height="92" rx="8" fill="#ffffff" stroke="#d8e5ef"/>
    <text x="874" y="844" class="small">ETYMOLOGY / 词源</text>
    <text x="874" y="881" class="body">From initial, meaning 'at the beginning', plus the adverb suffix -ly.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="68" y="850" width="238" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="148" y="884" class="button">← 上一张</text>
    <rect x="314" y="850" width="238" height="54" rx="9" fill="#020617"/>
    <text x="396" y="884" class="button-light">下一张 →</text>
    <rect x="560" y="850" width="238" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="650" y="884" class="button">随机</text>
    <rect x="806" y="850" width="238" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="894" y="884" class="button">已掌握</text>
    <rect x="1052" y="850" width="238" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1146" y="884" class="button">收藏</text>
    <rect x="1298" y="850" width="238" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1388" y="884" class="button">待复习</text>
  </g>
</svg>
